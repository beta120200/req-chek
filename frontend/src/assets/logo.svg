<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="Shield with checklist and checkmark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Logo</title>
  <defs>
    <!-- cuts a gap in the ring so the big check "breaks out" cleanly -->
    <mask id="ringCut" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="280">
      <rect width="240" height="280" fill="#fff"/>
      <path d="M88 170 L119 204 L208 84" fill="none" stroke="#000" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- shield ring -->
  <path mask="url(#ringCut)" fill="#2F7BC8" fill-rule="evenodd" stroke="#2F7BC8" stroke-width="6" stroke-linejoin="round"
        d="M120 8 L224 44 V128 C224 196 181 244 120 272 C59 244 16 196 16 128 V44 Z
           M120 28 L204 57 V128 C204 184 171 224 120 249 C69 224 36 184 36 128 V57 Z"/>
  <!-- inner face -->
  <path fill="#F3F7FB" d="M120 28 L204 57 V128 C204 184 171 224 120 249 C69 224 36 184 36 128 V57 Z" mask="url(#ringCut)"/>

  <!-- checklist -->
  <g fill="none" stroke="#2F7BC8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 76 L61 83 L73 69"/>
    <path d="M88 76 H132"/>
    <path d="M54 107 L61 114 L73 100"/>
    <path d="M88 107 H138"/>
    <path d="M54 138 L61 145 L73 131"/>
    <path d="M88 138 H124"/>
  </g>

  <!-- big check -->
  <path d="M88 170 L119 204 L208 84" fill="none" stroke="#2F7BC8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
